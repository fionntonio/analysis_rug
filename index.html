<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis — Lecture Notes</title>
  <meta name="description" content="Real analysis lecture notes and course information.">
  <meta property="og:title" content="Analysis — Lecture Notes">
  <meta property="og:description" content="Real analysis lecture notes and course information.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Analysis — Lecture Notes">
  <meta name="twitter:description" content="Real analysis lecture notes and course information.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; background: #f2f2ef; }

    /* ── App shell ─────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ── Top bar ────────────────────────────────────────────────── */
    #topbar {
      flex-shrink: 0;
      height: 46px;
      background: #193352;
      color: #e8eef4;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 10;
    }

    #menu-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #menu-btn:hover { background: rgba(255,255,255,0.12); }

    #topbar-title {
      font-family: sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0.88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #share-link {
      margin-left: auto;
      flex-shrink: 0;
      color: inherit;
      font: 0.8rem sans-serif;
    }

    #print-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid currentColor;
      border-radius: 4px;
      padding: 4px 8px;
      color: inherit;
      font: 0.8rem sans-serif;
      cursor: pointer;
    }
    #print-btn:hover { background: rgba(255,255,255,0.12); }
    #print-content { display: none; }

    @page { size: A4 portrait; margin: 14mm; }
    @media print {
      html, body { height: auto; background: #fff; color: #000; }
      #app, #nav-panel, #overlay { display: none !important; }
      #print-content { display: block; font-size: 11pt; line-height: 1.4; }
      #print-content .doc-wrap { max-width: none; margin: 0; padding: 0; }
      #print-content .slide-card {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
        transform: none;
        border: 1px solid #aaa;
        border-radius: 0;
        box-shadow: none;
        padding: 6mm;
        margin: 0 0 6mm;
        break-inside: avoid;
        break-after: page;
      }
      #print-content .slide-card:last-child { break-after: auto; }
      #print-content .slide-content { transform: none; }
      #print-content .handout-number { font: 9pt sans-serif; color: #555; margin-bottom: 3mm; }
      #print-content .tutorial-card { padding: 0; box-shadow: none; background: none; }
      #print-content h1, #print-content h2, #print-content h3 { break-after: avoid; }
      #print-content p, #print-content li { orphans: 3; widows: 3; }
      #print-content img { max-height: 65mm; break-inside: avoid; }
      #print-content pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      #print-content .katex-display { overflow: visible; }
    }

    /* ── Content area ───────────────────────────────────────────── */
    #content { flex: 1; min-height: 0; overflow: auto; }
    #content.slides-mode { overflow: hidden; }

    /* ── Welcome ────────────────────────────────────────────────── */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px 20px;
      color: #555;
    }
    #welcome h1 { font-size: 2rem; color: #193352; margin-bottom: 0.5rem; }
    #welcome p  { font-size: 1rem; max-width: 340px; margin: 0.3rem auto; line-height: 1.6; }
    #welcome .hint {
      margin-top: 1.5rem;
      font-family: sans-serif;
      font-size: 0.82rem;
      color: #888;
      background: rgba(0,0,0,0.04);
      border-radius: 6px;
      padding: 8px 14px;
    }

    /* ── Slide nav ──────────────────────────────────────────────── */
    #slide-nav {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 9px 16px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    #slide-nav.on { display: flex; }

    #exit-fullscreen-btn { display: none; }
    #app:fullscreen { width: 100%; height: 100%; background: #f2f2ef; }
    #app:fullscreen #topbar { display: none; }
    #app:fullscreen #exit-fullscreen-btn {
      display: block;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
    }
    #app:fullscreen .slide-wrap { padding-top: 48px; }
    #app:fullscreen #fullscreen-btn { display: none; }
    .nav-btn:focus-visible { outline: 3px solid #5aabdc; outline-offset: 3px; }

    .nav-btn {
      background: #193352;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 6px 16px;
      font-size: 0.87rem;
      font-family: sans-serif;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .nav-btn:hover:not(:disabled) { background: #0f2136; }
    .nav-btn:disabled { opacity: 0.28; cursor: default; }

    #slide-counter {
      font-family: sans-serif;
      font-size: 0.82rem;
      color: #888;
      min-width: 64px;
      text-align: center;
    }

    /* ── Nav panel ──────────────────────────────────────────────── */
    #nav-panel {
      position: fixed;
      inset: 0 auto 0 0;
      width: 272px;
      background: #0e2035;
      color: #cde0ef;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform 0.26s ease;
      z-index: 300;
      display: flex;
      flex-direction: column;
    }
    #nav-panel.open { transform: translateX(0); }

    .nav-header {
      flex-shrink: 0;
      height: 46px;
      background: #091825;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 14px;
    }
    .nav-header span {
      font-family: sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6a9dbe;
    }
    #close-btn {
      background: none;
      border: none;
      color: #cde0ef;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 4px;
      opacity: 0.65;
      transition: opacity 0.15s;
    }
    #close-btn:hover { opacity: 1; }

    .nav-body { flex: 1; padding: 6px 0 24px; }

    .nav-section {
      font-family: sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #4e7d9a;
      padding: 14px 14px 3px;
    }

    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: #a8c8de;
      font-family: sans-serif;
      font-size: 0.87rem;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .nav-item.active {
      background: rgba(255,255,255,0.09);
      border-left-color: #5aabdc;
      color: #fff;
    }

    /* ── Overlay ────────────────────────────────────────────────── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 299;
    }
    #overlay.on { display: block; }

    /* ── Slide / doc card content ───────────────────────────────── */
    .slide-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
    }

    .slide-frame { position: relative; flex-shrink: 0; }

    .slide-card {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 18px rgba(0,0,0,0.09);
      padding: 38px 48px;
      width: 760px;
      height: 570px;
      overflow: hidden;
    }

    .slide-content { display: flow-root; transform-origin: top left; }
    /* Content after a \pause; it keeps its space, as in Beamer. */
    #content .pause-hidden { visibility: hidden; }
    .slide-card img { max-height: 300px; object-fit: contain; }
    .slide-card .katex-display { overflow: visible; }


    .doc-wrap { max-width: 760px; margin: 0 auto; padding: 30px 20px 60px; }

    .tutorial-card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      padding: 22px 28px;
      margin: 0.6rem 0 0;
    }
    .tutorial-card > :first-child { margin-top: 0; }
    .tutorial-card > :last-child { margin-bottom: 0; }
    @media (max-width: 600px) { .tutorial-card { padding: 16px 16px; } }

    /* ── Typography ─────────────────────────────────────────────── */
    .slide-card h1, .doc-wrap h1 {
      font-size: 1.65rem;
      color: #193352;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    .slide-card h2, .doc-wrap h2 {
      font-size: 1.2rem;
      color: #1e4976;
      margin: 1.1rem 0 0.45rem;
      line-height: 1.4;
    }
    .slide-card h3, .doc-wrap h3 {
      font-size: 1rem;
      margin: 0.9rem 0 0.35rem;
    }

    .slide-card p, .doc-wrap p { margin: 0.5rem 0; }

    .slide-card ul, .slide-card ol,
    .doc-wrap  ul, .doc-wrap  ol { margin: 0.35rem 0 0.35rem 1.6rem; }
    .slide-card li, .doc-wrap li { margin: 0.18rem 0; }

    .slide-card table, .doc-wrap table {
      border-collapse: collapse;
      margin: 0.75rem 0;
      width: 100%;
      font-size: 0.93rem;
    }
    .slide-card th, .slide-card td,
    .doc-wrap  th, .doc-wrap  td {
      border: 1px solid #d8dde4;
      padding: 5px 10px;
      text-align: left;
    }
    .slide-card th, .doc-wrap th { background: #f0f4f8; font-weight: 600; }

    .slide-card img, .doc-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0.9rem auto;
    }

    .slide-card em, .doc-wrap em { font-style: italic; color: #555; font-size: 0.91em; }
    .slide-card strong, .doc-wrap strong { font-weight: 700; }

    .slide-card code, .doc-wrap code {
      font-family: 'Courier New', monospace;
      background: #f0f4f8;
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 0.87em;
    }
    .slide-card pre, .doc-wrap pre {
      background: #f0f4f8;
      border-radius: 5px;
      padding: 12px;
      overflow-x: auto;
      margin: 0.6rem 0;
    }
    .slide-card pre { overflow: visible; white-space: pre-wrap; overflow-wrap: anywhere; }
    .slide-card pre code, .doc-wrap pre code { background: none; padding: 0; }

    .slide-card hr, .doc-wrap hr {
      border: none;
      border-top: 1px solid #e2e6ea;
      margin: 1.4rem 0;
    }

    .slide-card blockquote, .doc-wrap blockquote {
      border-left: 3px solid #5aabdc;
      padding: 2px 0 2px 14px;
      color: #555;
      margin: 0.7rem 0;
    }

    .slide-title-block { margin-bottom: 1.4rem; padding-bottom: 1rem; border-bottom: 2px solid #e8edf2; }
    .stb-course { font-size: 1.45rem; font-weight: 700; color: #193352; }
    .stb-author { font-size: 0.93rem; color: #666; margin-top: 4px; }
    .stb-date   { font-size: 0.87rem; color: #888; margin-top: 2px; }

    /* KaTeX display: allow horizontal scroll on narrow screens */
    .katex-display { overflow-x: auto; overflow-y: hidden; }

    /* ── Slide layout (modelled on the old Beamer slides) ──────────
       Larger sans-serif text, a centred frame title, the current section
       in a slim running header, and a vertical rhythm driven by --gap,
       which fitSlide() tightens only when a slide would overflow. */
    .slide-card {
      padding: 26px 56px 30px;
      font-family: 'Latin Modern Sans', 'CMU Sans Serif', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 20px;
      line-height: 1.35;
    }
    .slide-content { --gap: 0.95em; }
    .slide-section {
      font-size: 0.62em;
      color: #6a7f96;
      padding-bottom: 0.35em;
      border-bottom: 1px solid #e3e8ee;
      margin-bottom: 0.6em;
    }
    .slide-card h1 { font-size: 1.5em; font-weight: normal; text-align: center; margin: 0.2em 0 var(--gap); }
    .slide-card h2 {
      font-size: 1.4em;
      font-weight: normal;
      text-align: center;
      color: #193352;
      margin: 0.15em 0 var(--gap);
      line-height: 1.25;
    }
    .slide-card h3 { font-size: 1.05em; margin: var(--gap) 0 calc(var(--gap) * 0.4); }
    .slide-card p { margin: 0 0 var(--gap); }
    .slide-card p:empty { display: none; }
    .slide-card ul, .slide-card ol { margin: 0 0 var(--gap) 1.4em; }
    .slide-card li { margin: calc(var(--gap) * 0.35) 0; }
    .slide-card li::marker { color: #1e4976; }
    .slide-card li > p { margin: 0 0 calc(var(--gap) * 0.35); }
    .slide-card li > ul, .slide-card li > ol { margin-bottom: 0; }
    .slide-card .katex { font-size: 1.1em; }
    .slide-card .katex-display { margin: calc(var(--gap) * -0.2) 0 var(--gap); }
    .slide-card .katex-display > .katex-display { margin: 0; }
    .slide-card img { margin: calc(var(--gap) * 0.5) auto; }
    .slide-card em { color: #444; font-size: 1em; }
    .slide-card .slide-source { font-size: 0.6em; color: #777; text-align: center; margin-top: calc(var(--gap) * -0.4); }
    .slide-card .slide-source em { color: inherit; }
    .slide-card table { font-size: 0.85em; margin: 0 0 var(--gap); }
    .slide-card pre { margin: 0 0 var(--gap); font-size: 0.85em; }
    .slide-card blockquote { margin: 0 0 var(--gap); }
    .slide-card .slide-title-block { text-align: center; margin: 1.2em 0 1.6em; padding-bottom: 1.1em; }
    .slide-card .stb-course { font-size: 1.7em; font-weight: normal; }
    .slide-card .stb-author { font-size: 0.85em; margin-top: 0.5em; }
    .slide-card .stb-date   { font-size: 0.85em; margin-top: 0.3em; }

    /* ── Loading / error ────────────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #888;
      font-family: sans-serif;
      font-size: 0.9rem;
    }
    .err {
      color: #b03020;
      background: #fdf2f1;
      border: 1px solid #e4b0a8;
      border-radius: 6px;
      padding: 14px 18px;
      font-family: sans-serif;
      font-size: 0.9rem;
      margin: 1rem 0;
    }

    /* ── Phones ───────────────────────────────────────────────────
       Slides are always scaled to fit the screen; on a phone held upright
       that makes them small, so suggest landscape. In landscape the bars
       are made thinner to leave more height for the slide. */
    #rotate-hint {
      display: none;
      flex-shrink: 0;
      text-align: center;
      font: 0.8rem sans-serif;
      color: #555;
      background: #e6ecf2;
      padding: 7px 12px;
    }
    @media (orientation: portrait) and (max-width: 600px) {
      #content.slides-mode ~ #rotate-hint { display: block; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #topbar { height: 34px; }
      #slide-nav { padding: 4px 12px; gap: 10px; }
      .nav-btn { padding: 4px 12px; }
      .slide-wrap { padding: 6px; }
      #app:fullscreen .slide-wrap { padding-top: 40px; }
    }

    /* ── Mobile ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .nav-btn { padding: 6px 11px; font-size: 0.83rem; }
    }
  </style>
</head>
<body>

<!-- ── Navigation panel ─────────────────────────────────────────── -->
<div id="nav-panel" aria-label="Lecture navigation" role="navigation">
  <div class="nav-header">
    <span>Analysis</span>
    <button id="close-btn" aria-label="Close menu">✕</button>
  </div>
  <div class="nav-body" id="nav-body">
    <div class="nav-section">Info</div>
    <button class="nav-item" data-file="md/Analysis-course-info.md" data-mode="doc">Course Information</button>
    <button class="nav-item" data-file="md/Analysis-final-exam-info.md" data-mode="slides">Information for the final exam</button>
    <button class="nav-item" data-file="tutorials.yaml" data-mode="doc" data-slug="tutorials">Tutorials</button>
    <div class="nav-section">Lectures</div>
    <!-- populated by JS -->
  </div>
</div>

<div id="overlay"></div>

<!-- ── App ──────────────────────────────────────────────────────── -->
<div id="app">
  <button class="nav-btn" id="exit-fullscreen-btn" aria-label="Exit fullscreen" aria-keyshortcuts="f" title="Exit fullscreen (F or Esc)">Exit fullscreen ↙</button>
  <header id="topbar">
    <button id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="nav-panel">
      <svg width="17" height="13" viewBox="0 0 17 13" fill="none">
        <rect width="17" height="2" rx="1" fill="currentColor"/>
        <rect y="5.5" width="17" height="2" rx="1" fill="currentColor"/>
        <rect y="11" width="17" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <span id="topbar-title">Analysis — Lecture Notes</span>
    <a id="share-link" hidden title="Copy this link for a lecture-specific preview">Share link</a>
    <button id="print-btn" hidden type="button">Print page</button>
  </header>

  <div id="content">
    <div id="welcome">
      <h1>Analysis</h1>
      <p>Real analysis lecture notes and course information.</p>
      <p>Marcello Seri — University of Groningen</p>
      <div class="hint">Open the menu (☰) to select a lecture or the syllabus.</div>
    </div>
  </div>

  <div id="rotate-hint" role="note">↻ Rotate your phone to landscape for larger slides</div>

  <div id="slide-nav">
    <button class="nav-btn" id="prev-btn" disabled>← Prev</button>
    <span id="slide-counter">1 / 1</span>
    <button class="nav-btn" id="next-btn">Next →</button>
    <button class="nav-btn" id="fullscreen-btn" aria-label="Enter fullscreen" aria-keyshortcuts="f" title="Enter fullscreen (F)">Fullscreen ⛶</button>
  </div>
</div>

<!-- Separate, unscaled content for printing; never replaces the current slide. -->
<div id="print-content" aria-hidden="true"></div>

<!-- ── Scripts ───────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  // ── Config ────────────────────────────────────────────────────────
  const LECTURE_COUNT = 14;
  const COURSE_FILE   = 'md/Analysis-course-info.md';
  const PAGES = {
    'course-info': {
      title: 'Course Information',
      description: 'Analysis course information: syllabus, tutorials, and assignments.'
    },
    'final-exam-info': { title: 'Information for the Final Exam' },
    'tutorials': {
      title: 'Analysis - Tutorials',
      description: 'Analysis tutorials: lecture content, questions to start the tutorial, and exercises.'
    }
  };

  // ── State ─────────────────────────────────────────────────────────
  let slides     = [];
  let slideIdx   = 0;
  let activeItem = null;
  let mode       = 'welcome'; // 'welcome' | 'doc' | 'slides'

  // ── DOM ───────────────────────────────────────────────────────────
  const navPanel     = document.getElementById('nav-panel');
  const navBody      = document.getElementById('nav-body');
  const overlay      = document.getElementById('overlay');
  const menuBtn      = document.getElementById('menu-btn');
  const closeBtn     = document.getElementById('close-btn');
  const topbarTitle  = document.getElementById('topbar-title');
  const contentEl    = document.getElementById('content');
  const slideNav     = document.getElementById('slide-nav');
  const prevBtn      = document.getElementById('prev-btn');
  const nextBtn      = document.getElementById('next-btn');
  const slideCounter = document.getElementById('slide-counter');
  const app = document.getElementById('app');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const exitFullscreenBtn = document.getElementById('exit-fullscreen-btn');

  // ── Printing ─────────────────────────────────────────────────────
  const printBtn = document.getElementById('print-btn');
  const printContent = document.getElementById('print-content');

  function preparePrint() {
    if (printBtn.hidden) return;
    if (mode === 'slides') {
      printContent.innerHTML = slides.map(function (html, i) {
        return '<section class="slide-card"><div class="handout-number">Slide '
          + (i + 1) + ' / ' + slides.length + '</div><div class="slide-content">'
          + html + '</div></section>';
      }).join('');
    } else {
      printContent.replaceChildren(contentEl.querySelector('.doc-wrap').cloneNode(true));
    }
    // Keep document anchors unique in the interactive page.
    printContent.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
  }

  window.addEventListener('beforeprint', preparePrint);
  printBtn.addEventListener('click', async function () {
    printBtn.disabled = true;
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      preparePrint();
      await Promise.all(Array.from(printContent.querySelectorAll('img'), function (img) {
        return img.decode().catch(function () {});
      }));
      if (document.fonts) await document.fonts.ready;
      window.print();
    } finally {
      printBtn.disabled = false;
    }
  });

  // ── Fullscreen presentation ───────────────────────────────────────
  fullscreenBtn.disabled = !document.fullscreenEnabled;
  if (fullscreenBtn.disabled) fullscreenBtn.title = 'Fullscreen is not supported by this browser';

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement === app) {
        await document.exitFullscreen();
      } else if (mode === 'slides' && document.fullscreenEnabled) {
        closeMenu();
        await app.requestFullscreen();
        // On touch devices that support it (e.g. Android), prefer landscape.
        if (matchMedia('(pointer: coarse)').matches && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      }
    } catch (err) {
      // Permission or browser policy can reject a fullscreen request.
      fullscreenBtn.title = 'Could not enter fullscreen: ' + err.message;
    }
  }

  fullscreenBtn.addEventListener('click', toggleFullscreen);
  exitFullscreenBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', function () {
    if (mode === 'slides') {
      (document.fullscreenElement === app ? exitFullscreenBtn : fullscreenBtn).focus();
    }
    requestAnimationFrame(fitSlide);
  });

  // ── Build lecture nav items ───────────────────────────────────────
  for (let i = 1; i <= LECTURE_COUNT; i++) {
    const btn = document.createElement('button');
    btn.className   = 'nav-item';
    btn.dataset.file = 'md/Analysis-lecture' + String(i).padStart(2, '0') + '.md';
    btn.dataset.mode = 'slides';
    btn.textContent  = 'Lecture ' + i;
    navBody.appendChild(btn);
  }

  // ── Menu open / close ─────────────────────────────────────────────
  function openMenu() {
    navPanel.classList.add('open');
    overlay.classList.add('on');
    menuBtn.setAttribute('aria-expanded', 'true');
  }

  function closeMenu() {
    navPanel.classList.remove('open');
    overlay.classList.remove('on');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  menuBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);

  // ── Math protection (shield LaTeX from marked) ────────────────────
  function protectMath(src) {
    const store = [];

    // Display math: $$...$$ (may be multiline)
    src = src.replace(/\$\$([\s\S]*?)\$\$/g, function (_, tex) {
      var id = '@@MD' + store.length + '@@';
      store.push({ display: true, tex: tex });
      return id;
    });

    // Single-dollar math may span lines (e.g. a cases environment).
    src = src.replace(/(?<!\$)\$(?!\$)((?:[^$\\]|\\[\s\S])+?)\$(?!\$)/g, function (_, tex) {
      var id = '@@MI' + store.length + '@@';
      store.push({ display: false, tex: tex });
      return id;
    });

    return { src: src, store: store };
  }

  // ── Pauses (Beamer's \pause) ──────────────────────────────────────
  // Inside math, everything after the n-th \pause is wrapped in
  // \htmlClass{md-pause-n}{…}. A wrapper cannot span a cell separator
  // (& or \\) or a closing group (}, \right, \end), so it is closed
  // there and reopened afterwards.
  var MATH_TOKEN = new RegExp([
    '\\\\\\\\\\s*(?:\\[[^\\]]*\\])?',              // \\ with optional [skip]
    '\\\\(?:begin|end)\\s*\\{[^}]*\\}',
    '\\\\(?:left|right)(?![a-zA-Z])\\s*(?:\\\\[a-zA-Z]+|\\\\.|.)',
    '\\\\[a-zA-Z]+|\\\\.',
    '[{}&]',
    '[^\\\\{}&]+'
  ].join('|'), 'g');

  function pauseMath(tex, newId) {
    if (!/\\pause(?![a-zA-Z])/.test(tex)) return tex;
    var out = '';
    var stack = [{ open: 0, active: [] }];
    function top() { return stack[stack.length - 1]; }
    function openWrapper(frame, id) {
      out += '\\htmlClass{md-pause-' + id + '}{';
      frame.open++;
    }
    function closeWrappers(frame) {
      out += '}'.repeat(frame.open);
      frame.open = 0;
    }
    (tex.match(MATH_TOKEN) || []).forEach(function (tok) {
      var frame = top();
      if (/^\\pause(?![a-zA-Z])/.test(tok)) {
        var id = newId();
        stack.forEach(function (f) { f.active.push(id); });
        openWrapper(frame, id);
      } else if (tok === '&' || /^\\\\/.test(tok)) {
        closeWrappers(frame);
        out += tok;
        if (frame.active.length) openWrapper(frame, frame.active[frame.active.length - 1]);
      } else if (tok === '{' || /^\\(begin|left)(?![a-zA-Z])/.test(tok)) {
        out += tok;
        stack.push({ open: 0, active: [] });
      } else if ((tok === '}' || /^\\(end|right)(?![a-zA-Z])/.test(tok)) && stack.length > 1) {
        closeWrappers(frame);
        stack.pop();
        out += tok;
        var parent = top();
        if (frame.active.length) openWrapper(parent, frame.active[frame.active.length - 1]);
      } else {
        out += tok;
      }
    });
    while (stack.length) closeWrappers(stack.pop());
    return out;
  }

  // Give every element after a pause a data-step attribute, the number of the
  // pause after which it appears. Pauses are numbered in document order.
  function markPauses(root) {
    var steps = new Map();
    var anchors = [];
    root.querySelectorAll('.md-pause, [class*="md-pause-"]').forEach(function (el) {
      var m = (el.getAttribute('class') || '').match(/md-pause-(\d+)/);
      var key = m ? 'math' + m[1] : el;
      if (!steps.has(key)) {
        steps.set(key, anchors.length + 1);
        // Content after a pause in a formula is hidden too.
        anchors.push(m ? (el.closest('.katex-display') || el.closest('.katex')) : el);
      }
      if (m) el.dataset.step = steps.get(key);
    });
    function mark(node, step) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (!node.textContent.trim()) return;
        var span = document.createElement('span');
        node.replaceWith(span);
        span.appendChild(node);
        node = span;
      } else if (node.nodeType !== Node.ELEMENT_NODE) {
        return;
      }
      node.dataset.step = Math.max(step, Number(node.dataset.step) || 0);
    }
    anchors.forEach(function (anchor, i) {
      for (var n = anchor; n && n !== root; n = n.parentNode) {
        for (var sib = n.nextSibling; sib; ) {
          var next = sib.nextSibling;
          mark(sib, i + 1);
          sib = next;
        }
      }
    });
    root.querySelectorAll('.md-pause').forEach(function (el) {
      var parent = el.parentNode;
      el.remove();
      if (parent.nodeName === 'P' && !parent.textContent.trim() && !parent.children.length) parent.remove();
    });
  }

  function restoreMath(html, store) {
    var pauseCount = 0;
    function newId() { return ++pauseCount; }
    store.forEach(function (item, i) {
      var id  = item.display ? '@@MD' + i + '@@' : '@@MI' + i + '@@';
      var out;
      try {
        out = katex.renderToString(pauseMath(item.tex.trim(), newId), {
          displayMode: item.display,
          throwOnError: false,
          strict: function (code) { return code === 'htmlExtension' ? 'ignore' : 'warn'; },
          trust: function (context) {
            return context.command === '\\htmlClass' && /^md-pause-\d+$/.test(context.class);
          }
        });
      } catch (e) {
        out = '<span style="color:#c00">[math error]</span>';
      }
      if (item.display) out = '<div class="katex-display">' + out + '</div>';
      // split/join avoids regex escaping issues
      html = html.split(id).join(out);
    });
    return html;
  }

  // ── Markdown rendering ────────────────────────────────────────────
  function renderMd(text) {
    var protected_ = protectMath(text);
    var html = marked.parse(protected_.src);

    // Fix image paths: ../fig/ -> fig/
    html = html.replace(/(<img[^>]+src=")\.\.\/fig\//g, '$1fig/');

    // A \pause outside math (math is still shielded at this point).
    html = html.replace(/\\pause(?![a-zA-Z])/g, '<span class="md-pause"></span>');

    html = restoreMath(html, protected_.store);

    // Workaround to make Markdown contents links work.
    var template = document.createElement('template');
    template.innerHTML = html;
    var usedIds = new Set();
    template.content.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (heading) {
      var base = heading.textContent.toLowerCase().trim()
        .replace(/[^\p{L}\p{N}\p{M}_\s-]/gu, '').replace(/\s/g, '-');
      var id = base;
      var suffix = 0;
      while (usedIds.has(id)) id = base + '-' + (++suffix);
      usedIds.add(id);
      heading.id = id;
    });
    markPauses(template.content);
    return template.innerHTML;
  }

  // ── Tutorials page (tutorials.yaml -> Markdown) ─────────────────
  function lectureSlug(n) { return 'lecture' + String(n).padStart(2, '0'); }

  function tutorialsToMd(data) {
    var tutorials = data.tutorials || [];
    var out = ['# ' + (data.title || 'Tutorials'), ''];
    if (data.intro) out.push(data.intro.trim(), '');

    out.push('## Contents', '');
    tutorials.forEach(function (t) {
      out.push(t.number + '. [Tutorial ' + t.number + '](#tutorial-' + t.number + ')'
        + (t.reading ? ' — ' + t.reading : ''));
    });

    tutorials.forEach(function (t) {
      out.push('', '---', '', '# Tutorial ' + t.number, '');
      out.push('## Content from the lecture', '');
      out.push((t.reading ? '**' + t.reading + '** — ' : '')
        + '[Lecture ' + t.number + ' slides](#' + lectureSlug(t.number) + ')', '');
      if (t.content) out.push(t.content.trim(), '');

      if (t.questions) out.push('## Questions to start the tutorial', '', t.questions.trim(), '');

      if (t.exercises && t.exercises.length) {
        out.push('## Tutorial exercises', '');
        t.exercises.forEach(function (e) { out.push('- ' + String(e).trim()); });
        out.push('');
      }
    });
    return out.join('\n');
  }

  // ── YAML frontmatter ──────────────────────────────────────────────
  function parseFrontmatter(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!m) return { meta: {}, body: text };

    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var colon = line.indexOf(':');
      if (colon > -1) {
        var key = line.slice(0, colon).trim();
        var val = line.slice(colon + 1).trim().replace(/^["']|["']$/g, '');
        meta[key] = val;
      }
    });

    return { meta: meta, body: m[2] };
  }

  // ── Slide splitting ───────────────────────────────────────────────
  function splitSlides(body) {
    return body.split(/\n---\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // ── Render & navigate slides ──────────────────────────────────────
  function fitSlide() {
    if (mode !== 'slides') return;
    const card = contentEl.querySelector('.slide-card');
    if (!card) return;
    const frame = card.parentElement;
    const body = card.querySelector('.slide-content');
    const style = getComputedStyle(card);
    const width = card.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const height = card.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    body.style.transform = '';

    // Shrink only the display formulas that are too wide, not the whole slide.
    body.querySelectorAll('.katex-display').forEach(function (eq) {
      eq.style.fontSize = '';
      const inner = eq.querySelector('.katex') || eq;
      if (inner.scrollWidth > width) {
        eq.style.fontSize = Math.max(0.7, width / inner.scrollWidth) + 'em';
      }
    });

    // Like LaTeX, first absorb overflow in the vertical spacing.
    const GAP_MAX = 0.95, GAP_MIN = 0.35;
    function setGap(g) { body.style.setProperty('--gap', g + 'em'); }
    setGap(GAP_MAX);
    if (body.scrollHeight > height) {
      let low = GAP_MIN, high = GAP_MAX;
      for (let i = 0; i < 8; i++) {
        const mid = (low + high) / 2;
        setGap(mid);
        if (body.scrollHeight <= height) low = mid;
        else high = mid;
      }
      setGap(low);
    }

    // Keep the text at its normal size if reducing figures is enough.
    const images = Array.from(body.querySelectorAll('img'));
    function sizeImages(factor) {
      images.forEach(function (img) { img.style.maxHeight = (300 * factor) + 'px'; });
    }
    sizeImages(1);
    if (images.length && body.scrollHeight > height) {
      let low = 0, high = 1;
      for (let i = 0; i < 12; i++) {
        const mid = (low + high) / 2;
        sizeImages(mid);
        if (body.scrollHeight <= height) low = mid;
        else high = mid;
      }
      // If text alone is too tall, retain useful figures and scale everything.
      sizeImages(low > 0.15 ? low : 1);
    }
    const innerScale = Math.min(1, width / body.scrollWidth, height / body.scrollHeight);
    body.style.transform = 'scale(' + innerScale + ')';

    // Scale the complete 4:3 card to the space between the two navigation bars.
    const wrap = frame.parentElement;
    const wrapStyle = getComputedStyle(wrap);
    const availableWidth = wrap.clientWidth - parseFloat(wrapStyle.paddingLeft) - parseFloat(wrapStyle.paddingRight);
    const availableHeight = wrap.clientHeight - parseFloat(wrapStyle.paddingTop) - parseFloat(wrapStyle.paddingBottom);
    const maxScale = document.fullscreenElement === app ? Infinity : 1;
    const scale = Math.max(0, Math.min(maxScale, availableWidth / 760, availableHeight / 570));
    frame.style.width = (760 * scale) + 'px';
    frame.style.height = (570 * scale) + 'px';
    card.style.transform = 'scale(' + scale + ')';
  }

  // Refit after viewport changes, image decoding and web-font loading.
  new ResizeObserver(fitSlide).observe(contentEl);
  if (document.fonts) document.fonts.addEventListener('loadingdone', fitSlide);

  // Steps of the current slide: content with data-step > step is hidden.
  let step = 0;
  let stepEls = [];
  let maxStep = 0;

  function setStep(s) {
    step = s;
    stepEls.forEach(function (el) { el.classList.toggle('pause-hidden', Number(el.dataset.step) > step); });
    prevBtn.disabled = slideIdx === 0 && step === 0;
    nextBtn.disabled = slideIdx === slides.length - 1 && step === maxStep;
  }

  function forward() {
    if (step < maxStep) setStep(step + 1);
    else if (slideIdx < slides.length - 1) showSlide(slideIdx + 1);
  }

  // As in Beamer, going back from the first step shows the previous slide complete.
  function backward() {
    if (step > 0) setStep(step - 1);
    else if (slideIdx > 0) showSlide(slideIdx - 1, true);
  }

  function showSlide(idx, complete) {
    slideIdx = Math.max(0, Math.min(idx, slides.length - 1));
    contentEl.innerHTML =
      '<div class="slide-wrap"><div class="slide-frame"><div class="slide-card"><div class="slide-content">'
      + slides[slideIdx] + '</div></div></div></div>';
    contentEl.querySelectorAll('img').forEach(function (img) {
      img.addEventListener('load', fitSlide, { once: true });
      img.addEventListener('error', fitSlide, { once: true });
    });
    fitSlide();
    contentEl.scrollTop = 0;
    slideCounter.textContent = (slideIdx + 1) + ' / ' + slides.length;
    stepEls = Array.from(contentEl.querySelectorAll('[data-step]'));
    maxStep = stepEls.reduce(function (m, el) { return Math.max(m, Number(el.dataset.step)); }, 0);
    setStep(complete ? maxStep : 0);
  }

  prevBtn.addEventListener('click', backward);
  nextBtn.addEventListener('click', forward);

  // Keyboard navigation
  document.addEventListener('keydown', function (e) {
    if (mode !== 'slides') return;
    if (e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.toLowerCase() === 'f' ||
        (e.key === 'Escape' && document.fullscreenElement === app)) {
      e.preventDefault();
      if (!e.repeat) toggleFullscreen();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      forward();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      backward();
    }
  });

  // Touch swipe
  var touchX0 = 0;
  contentEl.addEventListener('touchstart', function (e) {
    touchX0 = e.touches[0].clientX;
  }, { passive: true });
  contentEl.addEventListener('touchend', function (e) {
    if (mode !== 'slides') return;
    var dx = e.changedTouches[0].clientX - touchX0;
    if (Math.abs(dx) > 48) {
      dx < 0 ? forward() : backward();
    }
  }, { passive: true });

  // Trick make the preview show the appropriate title
  // and description
  function updatePreview(description) {
    var slug = slugFor(activeItem);
    var lecture = slug.match(/^lecture(\d+)$/);
    var title = lecture ? 'Analysis - Lecture ' + Number(lecture[1]) : PAGES[slug].title;
    document.title = title;
    topbarTitle.textContent = title;
    document.querySelector('meta[name="description"]').content = description;
    ['og', 'twitter'].forEach(function (prefix) {
      var attr = prefix === 'og' ? 'property' : 'name';
      document.querySelector('meta[' + attr + '="' + prefix + ':title"]').content = title;
      document.querySelector('meta[' + attr + '="' + prefix + ':description"]').content = description;
    });
    var shareLink = document.getElementById('share-link');
    shareLink.href = slug + '.html';
    shareLink.hidden = false;
  }

  // ── Load file ─────────────────────────────────────────────────────
  async function loadFile(file, fileMode) {
    mode = fileMode;
    printBtn.hidden = true;
    printContent.replaceChildren();
    if (fileMode !== 'slides' && document.fullscreenElement === app) {
      await document.exitFullscreen();
    }
    contentEl.classList.toggle('slides-mode', fileMode === 'slides');
    contentEl.innerHTML = '<div class="loading">Loading…</div>';
    slideNav.classList.toggle('on', fileMode === 'slides');

    try {
      var res = await fetch(file);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();

      if (fileMode === 'doc') {
        var documentSlug = slugFor(activeItem);
        updatePreview(PAGES[documentSlug].description);
        if (/\.ya?ml$/.test(file)) text = tutorialsToMd(jsyaml.load(text));
        contentEl.innerHTML = '<div class="doc-wrap">' + renderMd(text) + '</div>';
        // Wrap the content under each "Tutorial N" title (up to the next separator) in a card.
        if (/\.ya?ml$/.test(file)) {
          contentEl.querySelectorAll('.doc-wrap > h1[id^="tutorial-"]').forEach(function (h1) {
            var card = document.createElement('section');
            card.className = 'tutorial-card';
            h1.after(card);
            while (card.nextSibling && !/^(HR|H1)$/.test(card.nextSibling.nodeName)) card.appendChild(card.nextSibling);
          });
        }
        // We use namespaces to make the in-document anchors work; links to
        // other pages (e.g. #lecture01, #course-info/...) are left untouched.
        contentEl.querySelectorAll('a[href^="#"]').forEach(function (link) {
          var id = link.getAttribute('href').slice(1);
          if (id && document.getElementById(id) && contentEl.contains(document.getElementById(id))) {
            link.setAttribute('href', '#' + documentSlug + '/' + id);
          }
        });
      } else {
        var parsed   = parseFrontmatter(text);
        var meta     = parsed.meta;
        var rawSlides = splitSlides(parsed.body);

        var preview = document.createElement('div');
        preview.innerHTML = renderMd(rawSlides[0] || '');
        preview.querySelectorAll('p, li, h1, h2, h3').forEach(function (el) {
          el.appendChild(document.createTextNode('\n'));
        });
        updatePreview(preview.textContent.trim());

        var section = '';
        slides = rawSlides.map(function (slide, i) {
          var html = '';
          var tpl = document.createElement('template');
          tpl.innerHTML = renderMd(slide);
          // As in Beamer, a "# Section" heading goes into a running header
          // shown on every following slide instead of taking body space.
          var h1 = tpl.content.querySelector('h1');
          if (h1 && tpl.content.querySelector('h2')) {
            section = h1.innerHTML;
            h1.remove();
          }
          tpl.content.querySelectorAll('p').forEach(function (p) {
            if (/^\[Source:/.test(p.textContent.trim())) p.classList.add('slide-source');
          });
          if (i === 0 && meta.title) {
            html = '<div class="slide-title-block">'
              + '<div class="stb-course">' + meta.title + '</div>'
              + (meta.author ? '<div class="stb-author">' + meta.author + '</div>' : '')
              + (meta.date   ? '<div class="stb-date">'   + meta.date   + '</div>' : '')
              + '</div>';
          } else if (section) {
            html = '<div class="slide-section">' + section + '</div>';
          }
          return html + tpl.innerHTML;
        });

        showSlide(0);
      }
      printBtn.textContent = fileMode === 'slides' ? 'Print handout' : 'Print page';
      printBtn.hidden = false;
      preparePrint();
    } catch (err) {
      contentEl.innerHTML =
        '<div class="slide-wrap"><div class="err">Could not load content: ' + err.message + '</div></div>';
    }
  }

  // ── Item selection + hash routing (#lecture05, #course-info, #tutorials/tutorial-5, …) ──
  function slugFor(item) {
    if (item.dataset.slug) return item.dataset.slug;
    var m = item.dataset.file.match(/Analysis-(lecture\d+|course-info|final-exam-info)\.md$/);
    return m ? m[1] : null;
  }

  async function activate(item, updateHash) {
    navBody.querySelectorAll('.nav-item').forEach(function (b) { b.classList.remove('active'); });
    item.classList.add('active');
    activeItem = item;

    if (item.dataset.mode === 'doc') {
      topbarTitle.textContent = 'Analysis — Course Information';
    }

    if (updateHash) {
      var slug = slugFor(item);
      if (slug) history.replaceState(null, '', '#' + slug);
    }

    await loadFile(item.dataset.file, item.dataset.mode);
  }

  async function openFromHash() {
    var parts = location.hash.replace(/^#/, '').split('/');
    var slug = parts.shift();
    if (!slug) return;
    var items = navBody.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (slugFor(items[i]) !== slug) continue;
      if (activeItem !== items[i] || !contentEl.querySelector('.doc-wrap')) {
        await activate(items[i], false);
      }
      if (parts.length) {
        var id;
        try { id = decodeURIComponent(parts.join('/')); } catch (_) { return; }
        var target = document.getElementById(id);
        if (target && contentEl.contains(target)) target.scrollIntoView();
      } else {
        contentEl.scrollTop = 0;
      }
      return;
    }
  }

  // ── Nav click ─────────────────────────────────────────────────────
  navBody.addEventListener('click', function (e) {
    var item = e.target.closest('.nav-item');
    if (!item || !item.dataset.file) return;

    closeMenu();
    activate(item, true);
  });

  window.addEventListener('hashchange', openFromHash);
  openFromHash();

}());
</script>
</body>
